<body>

  <script>

    // 1. url of api 
    // 2. an object

    // fetch('',{
    //   Method: GET,PUT,PATCH,DELETE,POST -> Delete
    //   Headers:  Content type -> Json
    //   body -> 1
    // })

    fetch("https://jsonplaceholder.typicode.com/posts/3", {
      method: "GET",
      headers: {

      },

       body: {

      }
    })
      .then((response) => {
         response.json()
          .then((data) => 
        console.log(data));
      
      });
      
    

    async function getData() {
      try {
        let request = await fetch(
          "https://jsonplaceholder.typicode.com/posts/3",
          {}
        );

        if (!request.ok) {
          console.log(Error, request.status); // Error: 404
       
        }

        let response = await request.json();
        console.log(response);

      } catch (error) {
        console.log(error);
      }
    }

  
  </script>
