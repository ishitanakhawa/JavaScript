<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="setCookie()">Agree to Terms</button>
    <button onclick="checkCookie()">Show Cookie</button>
    <p></p>
    <script>
        function setCookie() {
            document.cookie= "username:Sumit; max-age:5;path:/";
        }
        function checkCookie() {
            document.querySelector('p').innerText=document.cookie
        } 
    </script>
    
</body>
</html>
