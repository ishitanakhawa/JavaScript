 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cache Image Demo</title>
</head>
<body>

  <button onclick="save()">Save to cache</button>
  <br><br>
  <img src="" alt="" width="400" />

  <script>
    let path =
      "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=800&q=80";

    async function save() {
      // create variable inside our cache, then add media to it
      let myBox = await caches.open("box");
      await myBox.add(path);
    
    }

    async function load() {
      // get the url
      // open the box, match/get url, insert that image url in the image tag
      let myBox = await caches.open("box");
      let response = await caches.match(path);
      console.log(response.url);
      document.querySelector("img").src = response.url;
    }


  </script>

</body>
</html>
