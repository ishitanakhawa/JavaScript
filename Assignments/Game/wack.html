<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wack A Mole</title>  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f0f4ff, black
      );
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      padding: 20px 25px 30px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 330px;
    }

    h1 {
      margin: 0 0 10px;
      color: #333;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .hole {
      background: #5a3825;
      border-radius: 50%;
      height: 80px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 6px 10px rgba(0,0,0,0.35);
    }

    .mole {
      position: absolute;
      bottom: -80px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      transition: bottom 0.25s ease;
    }

    .hole.show .mole {
      bottom: 0;
    }

    button {
      margin-top: 18px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #6c8cff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #5976e3;
    }
  </style></head>
<body>  <div class="container">
    <h1>Wack a mole</h1><div class="top-bar">
  <div>Score: <span id="score">0</span></div>
  <div>Time: <span id="time">20</span>s</div>
</div>

<div class="board" id="board"></div>

<button id="startBtn">Start</button>

  </div>  <script>

  const board = document.getElementById("board");
  const scoreText = document.getElementById("score");
  const timeText = document.getElementById("time");
  const startBtn = document.getElementById("startBtn");

  let score = 0;
  let time = 20;
  let gameTimer;
  let moleTimer;

  for (let i = 0; i < 9; i++) {
    const hole = document.createElement("div");
    hole.className = "hole";

    const mole = document.createElement("div");
    mole.className = "mole";
    mole.textContent = "🐹";

    hole.appendChild(mole);
    board.appendChild(hole);

 
    hole.onclick = function () {
      if (hole.classList.contains("show")) {
        score++;
        scoreText.textContent = score;
        hole.classList.remove("show");
      }
    };
  }

  const holes = document.querySelectorAll(".hole");


  function showRandomMole() {
    
    holes.forEach(h => h.classList.remove("show"));

    const randomIndex = Math.floor(Math.random() * holes.length);
    holes[randomIndex].classList.add("show");
  }

 
  function startGame() {
    score = 0;
    time = 20;
    scoreText.textContent = score;
    timeText.textContent = time;

    clearInterval(gameTimer);
    clearInterval(moleTimer);

    moleTimer = setInterval(showRandomMole, 700);

    gameTimer = setInterval(function () {
      time--;
      timeText.textContent = time;

      if (time === 0) {
        clearInterval(gameTimer);
        clearInterval(moleTimer);
        alert("Game Over! Score: " + score);
      }
    }, 1000);
  }

  startBtn.onclick = startGame;
</script></body>
</html>
