<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Whack-A-Mole!</title>
    <style>
  
  body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
  }

  h1 {
    margin-top: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 120px);
    gap: 12px;
    justify-content: center;
    margin: 20px auto;
  }

  .hole {
    width: 120px;
    height: 120px;
    background: #8d6e63;
    border-radius: 50%;
    cursor: pointer;
  }

  .mole {
    background: #ff5722;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: #43a047;
  }
</style>
   
  </head>
  <body>
    <h1>Wack-A-Mole!</h1>
    <h2>
      Score: <span id="score">0</span> | Time Left: <span id="time">30</span>s
    </h2>

    <div class="grid">
      <div class="hole" id="0"></div>
      <div class="hole" id="1"></div>
      <div class="hole" id="2"></div>
      <div class="hole" id="3"></div>
      <div class="hole" id="4"></div>
      <div class="hole" id="5"></div>
      <div class="hole" id="6"></div>
      <div class="hole" id="7"></div>
      <div class="hole" id="8"></div>
    </div>

    <button id="start-btn">Start Game</button>

    <script>
      const holes = document.querySelectorAll(".hole");
      const scoreDisplay = document.querySelector("#score");
      const timeDisplay = document.querySelector("#time");
      const startBtn = document.querySelector("#start-btn");

      let score = 0;
      let currentTime = 30;
      let moleTimer = null;
      let countDownTimer = null;
      let hitPosition = null;

      function randomHole() {
        // Remove mole class from all holes first
        holes.forEach((hole) => hole.classList.remove("mole"));

        // Pick a random hole
        let randomIdx = Math.floor(Math.random() * 9);
        let hole = holes[randomIdx];

        hole.classList.add("mole");
        hitPosition = hole.id;
      }

      // Logic for clicking a hole
      holes.forEach((hole) => {
        hole.addEventListener("mousedown", () => {
          if (hole.id === hitPosition) {
            score++;
            scoreDisplay.textContent = score;
            hitPosition = null; // Prevent double clicking same mole
            hole.classList.remove("mole");
          }
        });
      });

      function moveMole() {
        moleTimer = setInterval(randomHole, 700); // Speed of mole (700ms)
      }

      function countDown() {
        currentTime--;
        timeDisplay.textContent = currentTime;

        if (currentTime === 0) {
          clearInterval(countDownTimer);
          clearInterval(moleTimer);
          alert("GAME OVER! Your final score is " + score);
          resetGame();
        }
      }

      function startGame() {
        resetGame();
        moveMole();
        countDownTimer = setInterval(countDown, 1000);
      }

      function resetGame() {
        clearInterval(moleTimer);
        clearInterval(countDownTimer);
        score = 0;
        currentTime = 30;
        scoreDisplay.textContent = score;
        timeDisplay.textContent = currentTime;
        holes.forEach((hole) => hole.classList.remove("mole"));
      }

      startBtn.addEventListener("click", startGame);
    </script>
  </body>
</html>
